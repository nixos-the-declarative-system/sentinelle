[package]
name = "sentinelle"
version = "2.8.0"
edition = "2021"
description = "Monitoring CLI: HTTPS probes, latency and certificates"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
openssl = "0.10"
serde_json = "1"

[profile.release]
strip = true
